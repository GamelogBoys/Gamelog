<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | <./Swapnil's Devlops></title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <div class="container" id="container">
        <div class="form-container sign-up">
            <form>
                <h1>Create Account</h1>
                <div class="social-icons">
                    <a href="#" class="social"><i class="fa-brands fa-google-plus-g"></i></a>
                    <a href="#" class="social"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="social"><i class="fa-brands fa-github"></i></a>
                    <a href="#" class="social"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>
                <span>or use your email for registration</span>
                <input type="text" placeholder="Name" required/>
                <input type="email" placeholder="Email" required/>
                <input type="password" placeholder="Password" required/>
                <button>Sign Up</button>
            </form>
        </div>
        <div class="form-container sign-in">
            <form id="myForm" novalidate>
                <h1>Sign In</h1>
                <div class="social-icons">
                    <a href="/auth/google" target="_blank" class="social"><i class="fa-brands fa-google-plus-g"></i></a>
                    <a href="/auth/facebook" target="_blank" class="social"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="/auth/github" target="_blank" class="social"><i class="fa-brands fa-github"></i></a>
                    <a href="/auth/linkedin" target="_blank" class="social"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>
                <span>or use your email password</span>
                <div id="error-message" class="error-text" style="display:none;"></div>
                <input type="email" placeholder="Email" required id="Email"/>
                <input type="password" placeholder="Password" required id="Password"/>
                <a href="google.com/login">Forget Your Password?</a>
                <button formaction="profile.html" id="submitBtn">Sign In</button>
            </form>
        </div>
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Welcome Back!</h1>
                    <p>To keep connected with us please login with your personal info</p>
                    <button class="hidden" id="login">Sign In</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Hello, Friend!</h1>
                    <p>To keep connected with us please login with your personal info</p>
                    <button class="hidden" id="register">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
